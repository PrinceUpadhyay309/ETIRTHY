<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile | Bharadwaj Tirth Yatra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 text-gray-800">

<!-- Navbar -->
<div id="navbar"></div>

<!-- PROFILE PAGE -->
<section class="max-w-5xl mx-auto px-4 py-12">

  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-orange-800">
      My Profile
    </h1>
    <p class="text-sm text-gray-600 mt-1">
      Manage your personal information for bookings and communication
    </p>
  </div>

  <!-- Profile Card -->
  <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">

    <!-- Avatar + Name -->
    <div class="flex flex-col sm:flex-row items-center gap-6 mb-8">

      <img src="assets/images/avatar-default.png"
           alt="User Avatar"
           class="w-28 h-28 rounded-full border-4 border-orange-200">

      <div class="text-center sm:text-left">
        <h2 class="text-xl font-bold">Your Name</h2>
        <p class="text-sm text-gray-500">Registered User</p>
      </div>

    </div>

    <!-- Form -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Full Name -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Full Name
        </label>
        <input
          type="text"
          placeholder="Your full name"
          class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Email Address
        </label>
        <input
          type="email"
          disabled
          placeholder="email@example.com"
          class="w-full border rounded-lg px-4 py-3 bg-gray-100 cursor-not-allowed">
      </div>

      <!-- Mobile -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Mobile Number
        </label>
        <input
          type="tel"
          placeholder="+91 XXXXXXXX"
          class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <!-- City -->
      <div>
        <label class="block text-sm font-medium mb-1">
          City
        </label>
        <input
          type="text"
          placeholder="Your city"
          class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <!-- Emergency Contact -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium mb-1">
          Emergency Contact
        </label>
        <input
          type="tel"
          placeholder="+91 XXXXXXXX"
          class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

    </form>

    <!-- Actions -->
    <div class="mt-10 flex flex-col sm:flex-row gap-4">

      <button
        class="px-8 py-3 rounded-lg
               bg-orange-600 text-white
               font-semibold
               hover:bg-orange-700
               transition active:scale-95">
        Save Changes
      </button>

      <a href="change-password.html"
         class="px-8 py-3 rounded-lg
                border border-orange-300
                text-orange-700
                font-semibold
                hover:bg-orange-50
                transition text-center">
        Change Password
      </a>

    </div>

  </div>
</section>

<!-- Load Navbar -->
<script>
fetch("components/navbar.html")
  .then(res => res.text())
  .then(data => document.getElementById("navbar").innerHTML = data);
</script>
<script src="js/navbar.js"></script>
<script src="js/logout.js"></script>

</body>
</html>
