<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 text-gray-800">
    <!-- Mobile Overlay -->
    <div
      id="sidebarOverlay"
      class="fixed inset-0 bg-black/40 z-40 hidden md:hidden"
    ></div>

    <div class="min-h-screen flex">
      <!-- SIDEBAR -->
      <aside
        id="adminSidebar"
        class="fixed md:static inset-y-0 left-0 z-50 w-64 bg-white shadow-lg transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col"
      >
        <div class="px-6 py-5 border-b">
          <h2 class="text-xl font-extrabold text-orange-700">Admin Panel</h2>
          <p class="text-xs text-gray-500 mt-1">Bharadwaj Tirth Yatra</p>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1 text-sm font-medium">
          <a
            href="dashboard.html"
            class="flex px-4 py-2 rounded-lg hover:bg-gray-100"
            >📊 Dashboard</a
          >
          <a
            href="users.html"
            class="flex px-4 py-2 rounded-lg hover:bg-gray-100"
            >👤 Users</a
          >
          <a
            href="bookings.html"
            class="flex px-4 py-2 rounded-lg hover:bg-gray-100"
            >📦 Bookings</a
          >
          <a
            href="payments.html"
            class="flex px-4 py-2 rounded-lg hover:bg-gray-100"
            >💳 Payments</a
          >
          <a
            href="profile.html"
            class="flex px-4 py-2 rounded-lg bg-orange-100 text-orange-700"
            >⚙ Admin Profile</a
          >
          <a
            href="../index.html"
            class="flex px-4 py-2 rounded-lg hover:bg-gray-100"
            >🌐 Back to Site</a
          >
        </nav>

        <div class="px-4 py-4 border-t">
          <button
            onclick="logout()"
            class="w-full px-4 py-2 rounded-lg border border-red-300 text-red-600 hover:bg-red-50"
          >
            Logout
          </button>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="flex-1">
        <header
          class="bg-white shadow-sm px-6 py-4 flex justify-between items-center"
        >
          <!-- Page Title -->
          <div class="flex items-center gap-3">
            <button
              id="sidebarToggle"
              class="md:hidden text-xl px-2 py-1 rounded hover:bg-gray-100"
            >
              ☰
            </button>
            <h1 class="text-xl font-bold">Admin Profile</h1>
          </div>
        </header>

        <section class="p-6 max-w-3xl">
          <div class="bg-white rounded-xl shadow p-6 space-y-6">
            <div>
              <label for="admin-name" class="text-sm font-medium"
                >Admin Name</label
              >
              <input
                id="admin-name"
                class="w-full border rounded px-4 py-2 bg-gray-100"
                disabled
                value="Admin Name"
              />
            </div>

            <div>
              <label for="admin-email" class="text-sm font-medium">Email</label>
              <input
                id="admin-email"
                class="w-full border rounded px-4 py-2 bg-gray-100"
                disabled
                value="admin@email.com"
              />
            </div>

            <div>
              <label for="admin-role" class="text-sm font-medium">Role</label>
              <input
                id="admin-role"
                class="w-full border rounded px-4 py-2 bg-gray-100"
                disabled
                value="Administrator"
              />
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/admin-guard.js"></script>
    <script src="../js/admin-header.js"></script>
    <script src="js/logout.js"></script>
    <script src="../js/admin-sidebar.js"></script>
  </body>
</html>
